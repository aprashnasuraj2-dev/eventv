name: EventV static validation
on:
  push:
    branches: [main, "release/**"]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-catalog.mjs
      - name: Enforce separate worker topic paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: node scripts/check-lanes.mjs
      - name: Verify A–E branch isolation and checkpoint compatibility
        run: node scripts/test-lane-policy-v2.mjs
      - name: Wimbledon 2027 functional and edge tests
        run: node scripts/test-wimbledon-2027.mjs
      - run: node scripts/build.mjs
      - name: Automatically execute every topic .test.mjs regression suite
        run: node --test
      - run: node scripts/validate.mjs
      - name: Enforce updated project checkpoint
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-latest.mjs
