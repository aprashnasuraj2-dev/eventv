<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Back to School 2027 planning hub</title><desc id="d">AafnaiPatro EventV social card showing Back to School 2027 as school-specific planning with supply budget, price history, tax holiday and device fit tools.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141d30"/><stop offset="1" stop-color="#354866"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><g opacity=".08" stroke="#fff"><path d="M0 120H1200M0 165H1200M0 210H1200M0 255H1200M0 300H1200M0 345H1200M0 390H1200M0 435H1200M0 480H1200"/></g><circle cx="1050" cy="35" r="300" fill="#4577c8" opacity=".13"/><g transform="translate(72 68)"><rect width="56" height="56" rx="13" fill="#f2c75c"/><rect width="10" height="56" rx="5" fill="#d9a73a"/><text x="31" y="36" text-anchor="middle" fill="#263044" font-family="system-ui" font-size="18" font-weight="900">A+</text><text x="75" y="24" fill="#fff" font-family="system-ui" font-size="23" font-weight="800">AafnaiPatro</text><text x="75" y="49" fill="#b9c6db" font-family="system-ui" font-size="12" font-weight="700" letter-spacing="3">EVENTV</text></g><text x="72" y="218" fill="#ffe58a" font-family="system-ui" font-size="28" font-weight="800">YOUR SCHOOL DATE WINS</text><text x="72" y="304" fill="#fff" font-family="system-ui" font-size="72" font-weight="900">Back to School 2027</text><text x="72" y="376" fill="#d8deea" font-family="system-ui" font-size="30">calendar · supply budget · price history · tax · device fit</text><g transform="translate(835 155)"><rect width="285" height="325" rx="24" fill="#131d30" stroke="#53637d"/><text x="24" y="42" fill="#9fabbe" font-family="system-ui" font-size="11" letter-spacing="2">PLANNING BOARD</text><circle cx="40" cy="88" r="15" fill="#f2c75c"/><text x="40" y="93" text-anchor="middle" fill="#243047" font-family="system-ui" font-size="12" font-weight="900">1</text><text x="70" y="94" fill="#fff" font-family="system-ui" font-size="17" font-weight="800">CONFIRM DATE</text><circle cx="40" cy="143" r="15" fill="#f2c75c"/><text x="40" y="148" text-anchor="middle" fill="#243047" font-family="system-ui" font-size="12" font-weight="900">2</text><text x="70" y="149" fill="#fff" font-family="system-ui" font-size="17" font-weight="800">BUILD LIST</text><circle cx="40" cy="198" r="15" fill="#f2c75c"/><text x="40" y="203" text-anchor="middle" fill="#243047" font-family="system-ui" font-size="12" font-weight="900">3</text><text x="70" y="204" fill="#fff" font-family="system-ui" font-size="17" font-weight="800">TRACK PRICE</text><circle cx="40" cy="253" r="15" fill="#f2c75c"/><text x="40" y="258" text-anchor="middle" fill="#243047" font-family="system-ui" font-size="12" font-weight="900">4</text><text x="70" y="259" fill="#fff" font-family="system-ui" font-size="17" font-weight="800">VERIFY TAX / TECH</text></g><text x="72" y="542" fill="#aeb9ca" font-family="system-ui" font-size="21">Jul–Sep = editorial planning season, not a universal school calendar</text></svg>